<!DOCTYPE html>
<!--
================================================================================
  Agent Misbehavior Intelligence — single-page product prototype
================================================================================

  WHAT THIS IS
  A production-grade front-end prototype of an internal tool for teams operating
  AI agents. It turns raw agent traces into a structured, queryable, reviewable
  system for understanding where agents fail, why, how often, and whether product
  or prompt changes actually improve those failure modes over time. It is NOT a
  generic trace viewer — it is a misbehavior LABELING and ANALYSIS system: a
  hybrid of an observability console, a QA review workbench, and a product
  analytics tool. Everything runs in-browser on realistic mock data; no backend,
  no localStorage.

  APP STRUCTURE (files, load order matters)
    css/app.css     Design tokens (light/dark), layout, and all component styles.
    js/data.js      -> window.AMI_DATA. Deterministic mock data (seeded PRNG):
                       220 traces w/ nested steps + labels, 8 workflows, 12 tools,
                       5 releases, 6 reviewers, an 11-category failure taxonomy
                       (with subtypes), 5 eval datasets, saved views, insights.
    js/icons.js     -> window.icon(name,size). Inline SVG icon set.
    js/charts.js    -> window.Charts. Dependency-free SVG charts (line, stacked
                       bar, heatmap, scatter, leaderboard, diverging deltas,
                       donut, sankey-style flow, sparkline) w/ tooltips + drill.
                       Series colors come from validated CSS palette tokens and
                       follow the entity (failure mode), never the rank.
    js/util.js      -> window.U. Formatting, badge builders, the filter engine,
                       derived metrics (workflow/tool stats, trends, regressions,
                       similarity), and shared UI (modal/drawer/toast/menu).
    js/app.js       Application shell: state, router (view registry), sidebar,
                       topbar (search/date/env/theme/user), the shared sticky
                       filter bar, and the Overview (executive dashboard) view.
                       Exposes window.AMI for the split-out view files.
    js/views.js     Traces explorer, Trace detail/replay, taxonomy drawer, the
                       label editor, and promote-to-dataset / regression modals.
    js/views2.js    Review Queue, Taxonomy browser, Compare/regression, Datasets,
                       Insights, Settings.

  MOCK DATA MODEL (js/data.js)
    Trace   { id, workflow, release, environment, segment, model, goal, outcome,
              surfaceSuccess, timestamp, steps[], rootStepId, toolCount,
              stepCount, duration, cost, tokens, labels[], reviewStatus, reviewer,
              humanAgreed, humanFeedback, eval{correctness,groundedness,efficiency},
              primaryLabel, suggestedLabel, severity, datasetIds[] }
    Step    { id, step_number, type(planner|router|tool_call|memory_retrieval|
              synthesis|guardrail|final_response), input_summary, tool, args,
              output, result, score, suspicion, is_root_cause }
    Label   { label_id, subtype_id, source(model_suggestion|human_review),
              confidence, reviewer, timestamp, note, root_cause_step_id, severity }
    Category{ id, name, parent_id, description, inclusion, exclusion, symptoms[],
              examples[], severity_default, review_guidance, remediations, color }
    Data is generated with a seeded PRNG so dashboards are stable across reloads.
    It deliberately includes: passing runs, false positives, multi-label traces,
    reviewed/unreviewed mixes, and "surface success but semantic failure" cases.

  MAIN INTERACTION LOGIC
    - Router swaps #main via a view registry (window.AMI_VIEWS). Sidebar + topbar
      persist. State (filters, theme, selections, in-memory review edits) lives in
      app.js and is shared to the view files through window.AMI.
    - Every visible control does something: chart segments drill into filtered
      trace tables; failure badges open taxonomy detail; clicking a replay step
      updates the root-cause panel; reviewers accept/edit suggested labels; two
      traces can be pinned & compared; reviewed failures are promoted into eval
      datasets; global search spans trace IDs, workflows, tools, failure modes,
      and reviewers ("/" to focus). Tables sort, expand, and support ↑ ↓ / Enter.
    - Light/dark theme via [data-theme] on <html>. Empty, loading, and error
      states are first-class.
================================================================================
-->
